<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A lunch picker that won't let you eat the same thing twice in two days.">
<meta name="theme-color" content="#F0F1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151419" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lunch Call">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Lunch Call</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --paper:#F0F1EC; --card:#FFFFFF; --card-2:#F7F8F4;
  --ink:#1C1A22; --ink-2:#57525F; --ink-3:#8E8896;
  --rule:#DCDED6; --rule-2:#E8E9E3;
  --accent:#B8770F; --accent-ink:#FFFFFF; --accent-soft:#F7EDD8;
  --ok:#2F6D51; --ok-soft:#E4F0E9; --ok-line:#B6D6C4;
  --no:#A8412A; --no-soft:#F8E8E3; --no-line:#E6C2B7;
  --shadow:0 1px 2px rgba(28,26,34,.05), 0 10px 30px -14px rgba(28,26,34,.22);
  --display:"Bricolage Grotesque",Georgia,serif;
  --body:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#151419; --card:#1E1C24; --card-2:#26242D;
  --ink:#EDEBE6; --ink-2:#A8A2B2; --ink-3:#7A7484;
  --rule:#332F3B; --rule-2:#2A2731;
  --accent:#E3A73C; --accent-ink:#1C1A22; --accent-soft:#3A2E18;
  --ok:#6FBF95; --ok-soft:#1E3329; --ok-line:#2E5641;
  --no:#E08265; --no-soft:#37211B; --no-line:#5A3427;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 30px -14px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --paper:#151419; --card:#1E1C24; --card-2:#26242D;
  --ink:#EDEBE6; --ink-2:#A8A2B2; --ink-3:#7A7484;
  --rule:#332F3B; --rule-2:#2A2731;
  --accent:#E3A73C; --accent-ink:#1C1A22; --accent-soft:#3A2E18;
  --ok:#6FBF95; --ok-soft:#1E3329; --ok-line:#2E5641;
  --no:#E08265; --no-soft:#37211B; --no-line:#5A3427;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 30px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--body); font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none}
:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:4px}

.wrap{max-width:460px; margin:0 auto;
  padding:calc(22px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left)); display:flex; flex-direction:column; gap:18px; min-height:100vh; min-height:100dvh}

/* ---- masthead ---- */
.top{display:flex; align-items:baseline; justify-content:space-between; gap:12px}
.brand{font-family:var(--display); font-weight:800; font-size:17px; letter-spacing:-.02em}
.brand span{color:var(--accent)}
.stamp{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.sync{display:inline-flex; align-items:center; gap:5px}
.dot{width:5px; height:5px; border-radius:50%; background:var(--ink-3)}
.dot.live{background:var(--ok)}

/* ---- the card ---- */
#main{flex:1; display:flex; flex-direction:column; justify-content:center; gap:12px}
.stage{position:relative; display:flex; align-items:center}
.card{
  width:100%; background:var(--card); border:1px solid var(--rule); border-radius:18px;
  box-shadow:var(--shadow); padding:26px 24px 24px; position:relative; overflow:hidden;
  touch-action:pan-y; user-select:none; -webkit-user-select:none;
}
.card::before{content:""; position:absolute; inset:0 0 auto 0; height:3px; background:var(--accent)}
.card.settle{transition:transform .34s cubic-bezier(.2,.8,.3,1), opacity .34s ease}
.card.gone{transition:transform .3s ease-in, opacity .3s ease-in}

.eyebrow{font-family:var(--mono); font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3); margin:0 0 14px}
.eyebrow b{color:var(--accent); font-weight:500}
.pick{
  font-family:var(--display); font-weight:800; font-size:clamp(2.2rem,10.5vw,3.5rem);
  line-height:1.02; letter-spacing:-.035em; margin:0; text-wrap:balance; word-break:break-word;
}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:16px}
.chip{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.02em; padding:4px 8px;
  border-radius:999px; background:var(--card-2); color:var(--ink-2); border:1px solid var(--rule-2);
  font-variant-numeric:tabular-nums; white-space:nowrap;
}
.chip.warn{background:var(--accent-soft); color:var(--accent); border-color:transparent; font-weight:500}
.chip.walk{background:transparent; border-color:var(--rule); color:var(--ink-2)}
.hint{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); margin:18px 0 0; text-align:center}

/* swipe veils */
.veil{position:absolute; inset:0; display:flex; align-items:center; padding:0 26px; opacity:0; pointer-events:none; font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:700}
.veil.left{background:var(--no-soft); color:var(--no); justify-content:flex-start}
.veil.right{background:var(--ok-soft); color:var(--ok); justify-content:flex-end}

/* ---- actions ---- */
.acts{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.act{
  display:flex; flex-direction:column; align-items:center; gap:2px; padding:15px 10px;
  border-radius:14px; border:1px solid var(--rule); background:var(--card);
  font-weight:600; font-size:15px; transition:transform .12s ease, background .15s ease;
}
.act:active{transform:scale(.975)}
.act small{font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); font-weight:400}
.act.no{background:var(--no-soft); border-color:var(--no-line); color:var(--no)}
.act.yes{background:var(--ok-soft); border-color:var(--ok-line); color:var(--ok)}
.act[disabled]{opacity:.4; cursor:not-allowed}

.ghost{
  display:block; width:100%; text-align:center; padding:11px; border-radius:12px;
  border:1px dashed var(--rule); color:var(--ink-2); font-size:13.5px; font-weight:500;
}
.ghost:hover{border-style:solid; color:var(--ink)}

/* ---- footer nav ---- */
.foot{display:flex; justify-content:center; gap:4px; border-top:1px solid var(--rule); padding-top:14px; margin-top:auto}
.foot button{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); padding:7px 11px; border-radius:8px}
.foot button:hover{color:var(--ink); background:var(--card-2)}

/* ---- empty / setup ---- */
.setup h2{font-family:var(--display); font-weight:800; font-size:1.7rem; letter-spacing:-.03em; margin:0 0 6px; text-wrap:balance}
.setup p{color:var(--ink-2); font-size:14.5px; margin:0 0 16px; max-width:52ch}
textarea{
  width:100%; min-height:172px; padding:14px; border-radius:12px; border:1px solid var(--rule);
  background:var(--card); color:var(--ink); font-family:var(--mono); font-size:13.5px; line-height:1.75; resize:vertical;
}
textarea::placeholder{color:var(--ink-3)}
.primary{
  display:block; width:100%; margin-top:12px; padding:14px; border-radius:12px;
  background:var(--accent); color:var(--accent-ink); font-weight:700; font-size:15px;
}
.primary:active{transform:scale(.99)}

/* ---- sheet ---- */
.scrim{position:fixed; inset:0; background:rgba(20,18,25,.42); backdrop-filter:blur(2px); z-index:20}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:21; background:var(--paper);
  border-radius:20px 20px 0 0; border-top:1px solid var(--rule);
  max-height:86vh; display:flex; flex-direction:column; box-shadow:0 -10px 40px -16px rgba(0,0,0,.4);
}
.sheet-in{animation:rise .26s cubic-bezier(.2,.8,.3,1)}
@keyframes rise{from{transform:translateY(14px); opacity:.4} to{transform:none; opacity:1}}
.sheet-hd{display:flex; align-items:center; justify-content:space-between; padding:16px 20px 12px; border-bottom:1px solid var(--rule)}
.sheet-hd h3{font-family:var(--display); font-weight:800; font-size:1.15rem; letter-spacing:-.02em; margin:0}
.sheet-bd{overflow-y:auto; padding:14px 20px 28px; max-width:460px; margin:0 auto; width:100%}
.x{font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); padding:6px 9px; border-radius:8px}
.x:hover{background:var(--card-2); color:var(--ink)}

/* rows */
.row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--rule-2)}
.row:last-child{border-bottom:0}
.row-main{flex:1; min-width:0}
.row-name{font-weight:600; font-size:15px; overflow-wrap:anywhere}
.row-name.off{color:var(--ink-3); text-decoration:line-through}
.row-meta{font-family:var(--mono); font-size:10.5px; color:var(--ink-3); letter-spacing:.02em; margin-top:2px; font-variant-numeric:tabular-nums}
.row-meta em{font-style:normal; color:var(--accent)}
.pips{display:flex; gap:3px; flex-shrink:0}
.pip{width:7px; height:7px; border-radius:2px; background:var(--rule); }
.pip.on{background:var(--accent)}
.mini{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); padding:5px 7px; border-radius:7px; border:1px solid var(--rule-2); flex-shrink:0}
.mini:hover{color:var(--ink); border-color:var(--rule)}
.mini.danger:hover{color:var(--no); border-color:var(--no-line); background:var(--no-soft)}
.mini.walk{min-width:52px; text-align:center; font-variant-numeric:tabular-nums; color:var(--ink-2)}
.mini.walk.long{color:var(--accent); border-color:var(--accent-soft); background:var(--accent-soft)}
.seg{display:flex; border:1px solid var(--rule); border-radius:9px; overflow:hidden; flex-shrink:0}
.seg button{padding:8px 11px; font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3)}
.seg button.on{background:var(--accent); color:var(--accent-ink); font-weight:700}

.addbar{display:flex; gap:8px; margin-bottom:6px}
.addbar input{flex:1; padding:11px 12px; border-radius:10px; border:1px solid var(--rule); background:var(--card); color:var(--ink); font:inherit; font-size:14.5px; min-width:0}
.addbar button{padding:0 16px; border-radius:10px; background:var(--accent); color:var(--accent-ink); font-weight:700; font-size:14px; flex-shrink:0}

.sect{font-family:var(--mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3); margin:22px 0 8px}
.sect:first-child{margin-top:4px}
.note{font-size:13px; color:var(--ink-2); line-height:1.6; margin:0}
.note code{font-family:var(--mono); font-size:12px; background:var(--card-2); padding:1px 5px; border-radius:4px; border:1px solid var(--rule-2)}

.ctrl{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:12px 0; border-bottom:1px solid var(--rule-2)}
.ctrl-lab{font-size:14.5px; font-weight:500}
.ctrl-lab small{display:block; font-weight:400; font-size:12.5px; color:var(--ink-3); margin-top:1px}
.stepper{display:flex; align-items:center; gap:2px; border:1px solid var(--rule); border-radius:9px; overflow:hidden; flex-shrink:0}
.stepper button{width:32px; height:32px; font-size:16px; font-weight:600; color:var(--ink-2)}
.stepper button:hover{background:var(--card-2); color:var(--ink)}
.stepper span{min-width:26px; text-align:center; font-family:var(--mono); font-size:13px; font-weight:700; font-variant-numeric:tabular-nums}

.empty{text-align:center; color:var(--ink-3); font-size:13.5px; padding:26px 0}
.day{display:flex; align-items:baseline; gap:12px; padding:9px 0; border-bottom:1px solid var(--rule-2)}
.day-d{font-family:var(--mono); font-size:10.5px; color:var(--ink-3); width:62px; flex-shrink:0; letter-spacing:.02em}
.day-n{font-size:14.5px; font-weight:500; overflow-wrap:anywhere}
.day-n.skip{color:var(--ink-3); font-weight:400; font-style:italic}
.day{justify-content:flex-start}
.day-n{flex:1}
.day-w{font-family:var(--mono); font-size:9.5px; letter-spacing:.04em; color:var(--ink-3); border:1px solid var(--rule-2); border-radius:999px; padding:2px 7px; flex-shrink:0; white-space:nowrap}
.day-w.long{color:var(--accent); border-color:var(--accent-soft); background:var(--accent-soft)}

.toast{
  position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:40;
  background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:999px;
  font-size:13px; font-weight:600; box-shadow:var(--shadow); animation:rise .2s ease;
}
@media (prefers-reduced-motion:reduce){
  *,*::before{animation-duration:.01ms !important; transition-duration:.01ms !important}
}
</style>

</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">Lunch<span>.</span>Call</div>
    <div class="stamp sync" id="sync"><span class="dot" id="dot"></span><span id="syncTxt">local</span></div>
  </div>
  <div id="main"></div>
  <div class="foot">
    <button data-sheet="places">Places</button>
    <button data-sheet="history">History</button>
    <button data-sheet="rules">Rules</button>
  </div>
</div>
<div id="sheet"></div>
<div id="toast"></div>

<script>
(function(){
"use strict";
var LS = "lunchcall.v1";
var $ = function(s,r){ return (r||document).querySelector(s); };
var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){ return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]; }); };
var uid = function(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3); };

/* ---------- dates (local calendar days) ---------- */
function dstr(d){ var z = new Date(d.getTime() - d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
function today(){ return dstr(new Date()); }
function shift(s,n){ var p=s.split("-"); return dstr(new Date(+p[0], +p[1]-1, +p[2]+n)); }
function span(a,b){ return Math.round((new Date(b+"T00:00:00") - new Date(a+"T00:00:00"))/86400000); }
function label(s){
  var t=today();
  if(s===t) return "Today";
  if(s===shift(t,1)) return "Tomorrow";
  if(s===shift(t,-1)) return "Yesterday";
  var p=s.split("-"), d=new Date(+p[0],+p[1]-1,+p[2]);
  return d.toLocaleDateString(undefined,{weekday:"short", month:"short", day:"numeric"});
}
function weekday(s){ var p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString(undefined,{weekday:"long"}); }
function ago(n){ return n===0?"today":n===1?"yesterday":n+" days ago"; }

/* ---------- state ---------- */
function DEFAULTS(){
  return { gapMeals:1,        /* other lunches that must pass before a repeat */
           maxPer:3,          /* at most this many ... */
           windowMeals:5,     /* ... in your last N lunches */
           maxLongRun:2,      /* block a long walk once this many ran back to back */
           longFrom:"10" };   /* "10" = 5-10 min counts as long, "far" = only >10 */
}
function clamp(v, lo, hi, dflt){ v = +v; return isFinite(v) ? Math.min(hi, Math.max(lo, v)) : dflt; }
var state = { items:[], log:[], days:{}, settings:DEFAULTS() };
var view = today();
var db = null, lastPushed = "";

function normalize(o){
  o = o || {};
  var s = { items:[], log:[], days:{}, settings:DEFAULTS() };
  if(Array.isArray(o.items)) s.items = o.items.filter(function(i){ return i && i.name; }).map(function(i){
    return { id:i.id||uid(), name:String(i.name).slice(0,80), tags:Array.isArray(i.tags)?i.tags:[],
             walk:WALK_ORDER.indexOf(i.walk)>=0 ? i.walk : "10",
             rejects:+i.rejects||0, archived:!!i.archived };
  });
  if(Array.isArray(o.log)) s.log = o.log.filter(function(e){ return e && e.date && e.itemId; })
    .map(function(e){ return { date:e.date, itemId:e.itemId, name:e.name||"", walk:e.walk||null }; })
    .sort(function(a,b){ return a.date<b.date?1:-1; }).slice(0,400);
  if(o.days && typeof o.days==="object"){
    var keep = shift(today(),-45);
    Object.keys(o.days).forEach(function(k){
      if(k>=keep && o.days[k]) s.days[k] = { pickId:o.days[k].pickId||null, rejected:Array.isArray(o.days[k].rejected)?o.days[k].rejected:[], decided:o.days[k].decided||null };
    });
  }
  if(o.settings){
    var d = DEFAULTS(), c = o.settings;
    s.settings.gapMeals    = clamp(c.gapMeals,    0, 6, d.gapMeals);
    s.settings.maxPer      = clamp(c.maxPer,      1, 9, d.maxPer);
    s.settings.windowMeals = clamp(c.windowMeals, 2, 20, d.windowMeals);
    s.settings.maxLongRun  = clamp(c.maxLongRun,  1, 6, d.maxLongRun);
    s.settings.longFrom    = c.longFrom === "far" ? "far" : "10";
    if(s.settings.windowMeals <= s.settings.maxPer) s.settings.windowMeals = s.settings.maxPer + 1;
  }
  return s;
}
function readLocal(){ try{ var r=localStorage.getItem(LS); return r?JSON.parse(r):null; }catch(e){ return null; } }
function writeLocal(){ try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){} }
function push(){
  writeLocal();
  if(db){
    var body = JSON.parse(JSON.stringify(state));
    lastPushed = JSON.stringify(body);
    db.doc("lunch/state").set(body).catch(function(e){
      if(e && e.code==="quota_exceeded") toast("Storage full — trim your history");
      else if(e && (e.code==="revoked"||e.code==="not_granted")){ db=null; setSync(false); }
    });
  }
}
function save(){ push(); render(); }

function setSync(live){
  $("#dot").className = "dot" + (live?" live":"");
  $("#syncTxt").textContent = live ? "synced" : "this device";
  $("#sync").title = live ? "History is stored for your account — phone and laptop stay in step."
                          : "Saved in this browser only. Open the same link signed in to sync across devices.";
}

/* ---------- rules ----------
   Every rule here counts LOGGED LUNCHES, never calendar days. A day you
   didn't use the app does not exist: skipping Tuesday advances nothing,
   so Monday's lunch is still "your last lunch" when you open it Wednesday. */
var WALK_ORDER = ["5", "10", "far"];
var WALK_FULL  = { "5":"Under 5 min walk", "10":"5-10 min walk", "far":"Over 10 min walk" };
var WALK_PILL  = { "5":"<5 min", "10":"5-10", "far":">10 min" };

function sequence(before){
  return state.log.filter(function(e){ return e.date < before; })
                  .sort(function(a, b){ return a.date < b.date ? 1 : -1; });
}
function entryWalk(e){
  if(e.walk) return e.walk;                       /* snapshot taken when logged */
  var it = state.items.filter(function(i){ return i.id === e.itemId; })[0];
  return it ? it.walk : "10";
}
function sinceLast(itemId, seq){
  for(var i = 0; i < seq.length; i++) if(seq[i].itemId === itemId) return i;
  return Infinity;
}
function countInWindow(itemId, seq){
  var c = 0, lim = Math.min(state.settings.windowMeals, seq.length);
  for(var i = 0; i < lim; i++) if(seq[i].itemId === itemId) c++;
  return c;
}
function isLong(walk){
  return state.settings.longFrom === "10" ? (walk === "10" || walk === "far") : walk === "far";
}
function longRun(seq){                            /* long walks at the head of the sequence */
  var n = 0;
  for(var i = 0; i < seq.length; i++){ if(isLong(entryWalk(seq[i]))) n++; else break; }
  return n;
}
function lunchesAgo(n){
  return n === Infinity ? "Never logged" : n === 0 ? "Your last lunch"
       : n === 1 ? "1 lunch ago" : n + " lunches ago";
}

/* tier 1 clears everything - 2 frequency cap full - 3 too many long walks
   back to back - 4 inside the repeat cooldown. Bend in that order: walking
   far again is a smaller insult than eating the same thing twice running. */
function judge(item, date, seq){
  seq = seq || sequence(date);
  var s = state.settings;
  var since = sinceLast(item.id, seq);
  var count = countInWindow(item.id, seq);
  var run   = longRun(seq);
  var gap   = since < s.gapMeals;
  var cap   = count >= s.maxPer;
  var walk  = isLong(item.walk) && run >= s.maxLongRun;
  return { since:since, count:count, run:run, gap:gap, cap:cap, walk:walk,
           tier: gap ? 4 : walk ? 3 : cap ? 2 : 1 };
}
function weighted(pool){
  var w = pool.map(function(x){
    var stale   = x.v.since === Infinity ? 12 : Math.min(x.v.since, 12);
    var fatigue = Math.pow(0.6, Math.min(x.item.rejects || 0, 6));
    return Math.max(0.05, (1 + stale) * fatigue);
  });
  var sum = w.reduce(function(a, b){ return a + b; }, 0), r = Math.random() * sum;
  for(var i = 0; i < pool.length; i++){ r -= w[i]; if(r <= 0) return pool[i]; }
  return pool[pool.length - 1];
}
function choose(date, skipIds){
  var live = state.items.filter(function(i){ return !i.archived; });
  if(!live.length) return null;
  var pool = live.filter(function(i){ return skipIds.indexOf(i.id) < 0; });
  var exhausted = false;
  if(!pool.length){ pool = live; exhausted = true; }   /* you turned down everything */
  var seq = sequence(date);
  var scored = pool.map(function(i){ return { item:i, v:judge(i, date, seq) }; });
  for(var t = 1; t <= 4; t++){
    var tier = scored.filter(function(x){ return x.v.tier === t; });
    if(tier.length){ var win = weighted(tier); win.exhausted = exhausted; return win; }
  }
  return null;
}
function dayOf(date){
  if(!state.days[date]) state.days[date] = { pickId:null, rejected:[], decided:null };
  return state.days[date];
}
function ensurePick(date){
  var d = dayOf(date);
  if(d.decided) return null;
  if(d.pickId){
    var still = state.items.filter(function(i){ return i.id === d.pickId && !i.archived; })[0];
    if(still) return { item:still, v:judge(still, date), exhausted:false };
  }
  var c = choose(date, d.rejected);
  d.pickId = c ? c.item.id : null;
  if(c) push();                                        /* same pick if you reopen */
  return c;
}

/* ---------- actions ---------- */
function reject(){
  var d = dayOf(view);
  if(!d.pickId) return;
  var it = state.items.filter(function(i){ return i.id === d.pickId; })[0];
  if(it) it.rejects = (it.rejects || 0) + 1;
  if(d.rejected.indexOf(d.pickId) < 0) d.rejected.push(d.pickId);
  d.pickId = null;
  save();
}
function accept(){
  var d = dayOf(view);
  if(!d.pickId) return;
  var it = state.items.filter(function(i){ return i.id === d.pickId; })[0];
  if(!it) return;
  state.log = state.log.filter(function(e){ return e.date !== view; });
  state.log.unshift({ date:view, itemId:it.id, name:it.name, walk:it.walk });
  state.log = state.log.slice(0, 400);
  d.decided = it.id;
  save();
}
function skipDay(){ var d = dayOf(view); state.log = state.log.filter(function(e){ return e.date !== view; }); d.decided = "skip"; save(); }
function undo(){ var d = dayOf(view); d.decided = null; d.rejected = []; state.log = state.log.filter(function(e){ return e.date !== view; }); save(); }
function reshuffle(){ var d = dayOf(view); d.rejected = []; d.pickId = null; save(); }

/* ---------- render ---------- */
function render(){
  var main = $("#main");
  if(!state.items.length){ main.innerHTML = setupHTML(); return; }
  if(!state.items.filter(function(i){ return !i.archived; }).length){ main.innerHTML = stuckHTML(); return; }
  var d = dayOf(view);
  if(d.decided) main.innerHTML = decidedHTML(d);
  else {
    var c = ensurePick(view);
    main.innerHTML = c ? pickHTML(c) : stuckHTML();
    if(c) arm();
  }
}

function setupHTML(){
  return '<div class="setup">'
    + '<h2>What do you actually eat?</h2>'
    + '<p>One place per line. You can set walking times afterwards under Places, and add or remove them any time.</p>'
    + '<textarea id="seed" spellcheck="false" placeholder="e.g.\nSweetgreen\nHalal Guys\nJoe&#39;s Pizza\nChipotle\nRamen Danbo"></textarea>'
    + '<button class="primary" id="seedGo">Save my list</button></div>';
}

function pickHTML(c){
  var v = c.v, s = state.settings, chips = [];
  chips.push('<span class="chip walk">' + WALK_FULL[c.item.walk] + '</span>');
  chips.push('<span class="chip">' + lunchesAgo(v.since) + '</span>');
  chips.push('<span class="chip">' + v.count + ' of ' + s.maxPer + ' in your last ' + s.windowMeals + '</span>');
  if(v.tier === 2) chips.push('<span class="chip warn">Bending the ' + s.maxPer + '-in-' + s.windowMeals + ' cap</span>');
  if(v.tier === 3) chips.push('<span class="chip warn">' + v.run + ' long walks running already</span>');
  if(v.tier === 4) chips.push('<span class="chip warn">Inside the repeat cooldown</span>');
  if(c.exhausted) chips.push('<span class="chip warn">You turned down everything else</span>');

  var d = dayOf(view);
  var turned = d.rejected.length ? ' · <b>' + d.rejected.length + ' passed</b>' : '';
  return '<div class="stage"><div class="card" id="card">'
      + '<div class="veil left" id="veilL">Pass</div><div class="veil right" id="veilR">Going</div>'
      + '<p class="eyebrow">' + esc(label(view)) + ' · ' + esc(weekday(view)) + ' lunch' + turned + '</p>'
      + '<h1 class="pick">' + esc(c.item.name) + '</h1>'
      + '<div class="chips">' + chips.join("") + '</div>'
      + '<p class="hint">Swipe · or tap below</p>'
    + '</div></div>'
    + '<div class="acts">'
      + '<button class="act no" id="bNo">Not this<small>swipe left</small></button>'
      + '<button class="act yes" id="bYes">Going<small>swipe right</small></button>'
    + '</div>'
    + '<button class="ghost" id="bSkip">Not eating out ' + (view === today() ? "today" : "that day") + '</button>';
}

function decidedHTML(d){
  var e = state.log.filter(function(x){ return x.date === view; })[0];
  var name = d.decided === "skip" ? null : (e || {}).name;
  var tmr = shift(today(), 1);
  return '<div class="stage"><div class="card">'
      + '<p class="eyebrow">' + esc(label(view)) + ' · <b>Locked in</b></p>'
      + '<h1 class="pick">' + (name ? esc(name) : "Eating in") + '</h1>'
      + '<div class="chips">' + (name
          ? '<span class="chip walk">' + WALK_FULL[entryWalk(e)] + '</span><span class="chip">Counted in your rules</span>'
          : '<span class="chip">Not counted — this day is skipped</span>') + '</div>'
    + '</div></div>'
    + '<div class="acts">'
      + '<button class="act" id="bUndo">Undo<small>wrong call</small></button>'
      + '<button class="act" id="bNext">' + (view === today() ? "Plan tomorrow" : "Back to today") + '<small>' + (view === today() ? esc(weekday(tmr)) : esc(weekday(today()))) + '</small></button>'
    + '</div>';
}

function stuckHTML(){
  return '<div class="stage"><div class="card">'
      + '<p class="eyebrow">' + esc(label(view)) + ' · <b>Nothing left</b></p>'
      + '<h1 class="pick">Out of options</h1>'
      + '<div class="chips"><span class="chip warn">Every place is archived</span></div>'
    + '</div></div>'
    + '<button class="ghost" data-sheet="places">Restore a place</button>';
}

/* ---------- swipe ---------- */
function arm(){
  var card = $("#card"); if(!card) return;
  var L = $("#veilL"), R = $("#veilR");
  var x0 = 0, y0 = 0, dx = 0, drag = false, locked = false;

  card.addEventListener("pointerdown", function(e){
    if(e.pointerType === "mouse" && e.button !== 0) return;
    drag = true; locked = false; x0 = e.clientX; y0 = e.clientY; dx = 0;
    card.classList.remove("settle");
  });
  card.addEventListener("pointermove", function(e){
    if(!drag) return;
    var mx = e.clientX - x0, my = e.clientY - y0;
    if(!locked){
      if(Math.abs(mx) < 8 && Math.abs(my) < 8) return;
      if(Math.abs(my) > Math.abs(mx)){ drag = false; return; }   /* let the page scroll */
      locked = true; card.setPointerCapture(e.pointerId);
    }
    dx = mx;
    card.style.transform = "translateX(" + dx + "px) rotate(" + (dx / 26) + "deg)";
    L.style.opacity = dx < 0 ? Math.min(1, -dx / 110) : 0;
    R.style.opacity = dx > 0 ? Math.min(1,  dx / 110) : 0;
  });
  function release(){
    if(!drag) return; drag = false;
    if(Math.abs(dx) > 92){
      card.classList.add("gone");
      card.style.transform = "translateX(" + (dx > 0 ? window.innerWidth : -window.innerWidth) + "px) rotate(" + (dx / 16) + "deg)";
      card.style.opacity = "0";
      var go = dx > 0 ? accept : reject;
      setTimeout(go, 190);
    } else {
      card.classList.add("settle");
      card.style.transform = ""; L.style.opacity = 0; R.style.opacity = 0;
    }
  }
  card.addEventListener("pointerup", release);
  card.addEventListener("pointercancel", release);
}

/* ---------- sheets ---------- */
var openSheet = null;
function sheet(kind){
  openSheet = kind;
  var titles = { places:"Your places", history:"What you ate", rules:"Rules & backup" };
  var body = kind === "places" ? placesHTML() : kind === "history" ? historyHTML() : rulesHTML();
  $("#sheet").innerHTML = '<div class="scrim" id="scrim"></div><div class="sheet sheet-in" role="dialog" aria-modal="true" aria-label="' + titles[kind] + '">'
    + '<div class="sheet-hd"><h3>' + titles[kind] + '</h3><button class="x" id="close">Done</button></div>'
    + '<div class="sheet-bd">' + body + '</div></div>';
}
function closeSheet(){ openSheet = null; $("#sheet").innerHTML = ""; }
function refresh(){ if(openSheet) sheet(openSheet); render(); }

function placesHTML(){
  var t = today(), seq = sequence(t), s = state.settings;
  var rows = state.items.map(function(i){
    var v = judge(i, t, seq);
    var pips = "";
    for(var k = 0; k < s.maxPer; k++) pips += '<span class="pip' + (k < v.count ? " on" : "") + '"></span>';
    var bits = [ lunchesAgo(v.since) ];
    if(v.gap) bits.push("<em>cooling down</em>");
    else if(v.walk) bits.push("<em>too many long walks</em>");
    else if(v.cap) bits.push("<em>at the cap</em>");
    if((i.rejects || 0) >= 6) bits.push("<em>passed " + i.rejects + "×</em>");
    return '<div class="row"><div class="row-main">'
      + '<div class="row-name' + (i.archived ? " off" : "") + '">' + esc(i.name) + '</div>'
      + '<div class="row-meta">' + bits.join(" · ") + '</div></div>'
      + '<button class="mini walk' + (isLong(i.walk) ? " long" : "") + '" data-walk="' + i.id + '" title="Walking time — tap to change">' + WALK_PILL[i.walk] + '</button>'
      + '<div class="pips" title="' + v.count + ' of ' + s.maxPer + ' in your last ' + s.windowMeals + ' lunches">' + pips + '</div>'
      + '<button class="mini' + (i.archived ? "" : " danger") + '" data-toggle="' + i.id + '">' + (i.archived ? "Restore" : "Archive") + '</button></div>';
  }).join("");
  return '<div class="addbar"><input id="addName" placeholder="Add a place" autocomplete="off"><button id="addGo">Add</button></div>'
    + (rows || '<p class="empty">Nothing here yet.</p>')
    + '<p class="sect">Walking time</p>'
    + '<p class="note">Tap a place’s time pill to cycle it: under 5 min, 5-10, over 10. Highlighted pills count as a long walk under the rule below.</p>'
    + '<p class="sect">Archiving keeps the history</p>'
    + '<p class="note">Archive a place that has closed or that you are sick of — it stops being suggested but your past lunches stay counted.</p>';
}

function historyHTML(){
  var skips = Object.keys(state.days).filter(function(k){ return state.days[k].decided === "skip"; })
    .map(function(k){ return { date:k, skip:true }; });
  var all = state.log.concat(skips).sort(function(a, b){ return a.date < b.date ? 1 : -1; }).slice(0, 40);
  if(!all.length) return '<p class="empty">No lunches logged yet.</p>';
  var n = 0;
  var rows = all.map(function(e){
    var tag = e.skip ? '<span class="day-n skip">ate in — skipped</span>'
      : '<span class="day-n">' + esc(e.name) + '</span><span class="day-w' + (isLong(entryWalk(e)) ? " long" : "") + '">' + WALK_PILL[entryWalk(e)] + '</span>';
    if(!e.skip) n++;
    return '<div class="day"><span class="day-d">' + esc(label(e.date)) + '</span>' + tag + '</div>';
  }).join("");
  return rows
    + '<p class="sect">' + n + ' logged ' + (n === 1 ? "lunch" : "lunches") + '</p>'
    + '<p class="note">Only these count. Passing on a suggestion never writes here, and a skipped day is invisible to every rule — it does not break a streak or advance a cooldown.</p>';
}

function rulesHTML(){
  var s = state.settings;
  return '<div class="ctrl"><div class="ctrl-lab">Repeat cooldown<small>Other lunches before the same place returns</small></div>'
      + '<div class="stepper"><button data-step="gapMeals:-1">−</button><span>' + s.gapMeals + '</span><button data-step="gapMeals:1">+</button></div></div>'
    + '<div class="ctrl"><div class="ctrl-lab">Frequency cap<small>Most times in your last ' + s.windowMeals + ' lunches</small></div>'
      + '<div class="stepper"><button data-step="maxPer:-1">−</button><span>' + s.maxPer + '</span><button data-step="maxPer:1">+</button></div></div>'
    + '<div class="ctrl"><div class="ctrl-lab">Window<small>How many recent lunches that cap looks at</small></div>'
      + '<div class="stepper"><button data-step="windowMeals:-1">−</button><span>' + s.windowMeals + '</span><button data-step="windowMeals:1">+</button></div></div>'
    + '<div class="ctrl"><div class="ctrl-lab">Long walks in a row<small>Block another once this many ran back to back</small></div>'
      + '<div class="stepper"><button data-step="maxLongRun:-1">−</button><span>' + s.maxLongRun + '</span><button data-step="maxLongRun:1">+</button></div></div>'
    + '<div class="ctrl"><div class="ctrl-lab">A long walk means<small>Which places that rule applies to</small></div>'
      + '<div class="seg"><button data-long="10" class="' + (s.longFrom === "10" ? "on" : "") + '">5 min+</button>'
      + '<button data-long="far" class="' + (s.longFrom === "far" ? "on" : "") + '">10 min+</button></div></div>'
    + '<p class="sect">Days you skip do not exist</p>'
    + '<p class="note">Every number here counts logged lunches, not dates. If you don’t use the app on Tuesday, Monday’s lunch is still your last one on Wednesday — nothing decays while you are away.</p>'
    + '<p class="sect">When the rules run out</p>'
    + '<p class="note">With a short list every option can get blocked. Rather than refuse, the card bends one rule at a time and says so: the frequency cap first, then the long-walk streak, and the repeat cooldown last.</p>'
    + '<p class="sect">Backup</p>'
    + '<p class="note" style="margin-bottom:10px">Your list and history live in this browser only. Keep a copy.</p>'
    + '<div class="addbar"><button id="dl" style="flex:1; background:var(--card); color:var(--ink); border:1px solid var(--rule); padding:11px">Download JSON</button>'
    + '<button id="cp" style="flex:1; background:var(--card); color:var(--ink); border:1px solid var(--rule); padding:11px">Copy</button></div>';
}

function fileSave(text, name){
  try{
    var url = URL.createObjectURL(new Blob([text], { type:"application/json" }));
    var a = document.createElement("a");
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1000);
    toast("Saved");
  }catch(e){ toast("Could not save — use Copy"); }
}
function repick(){
  var d = dayOf(view);
  if(!d.decided) d.pickId = null;       /* a changed rule can invalidate today's pick */
  push(); refresh();
}
function toast(msg){
  $("#toast").innerHTML = '<div class="toast">'+esc(msg)+'</div>';
  setTimeout(function(){ $("#toast").innerHTML=""; }, 2200);
}

/* ---------- events ---------- */
document.addEventListener("click", function(e){
  var el = e.target.closest("button"); if(!el) return;
  var id = el.id;

  if(el.dataset.sheet) return sheet(el.dataset.sheet);
  if(id==="close" || el.id==="scrim") return closeSheet();

  if(id==="seedGo"){
    var lines = ($("#seed").value||"").split("\n").map(function(s){ return s.trim(); }).filter(Boolean);
    var seen = {};
    lines.forEach(function(n){ var k=n.toLowerCase(); if(seen[k]) return; seen[k]=1;
      state.items.push({ id:uid(), name:n.slice(0,80), tags:[], walk:"10", rejects:0, archived:false }); });
    if(!state.items.length) return toast("Add at least one place");
    return save();
  }
  if(id==="bNo") return reject();
  if(id==="bYes") return accept();
  if(id==="bSkip") return skipDay();
  if(id==="bUndo") return undo();
  if(id==="bReset") return reshuffle();
  if(id==="bNext"){ view = (view===today()) ? shift(today(),1) : today(); return render(); }

  if(id==="addGo"){
    var inp = $("#addName"), n = (inp.value||"").trim();
    if(!n) return;
    state.items.push({ id:uid(), name:n.slice(0,80), tags:[], walk:"10", rejects:0, archived:false });
    inp.value=""; push(); refresh(); return;
  }
  if(el.dataset.toggle){
    var it = state.items.filter(function(i){ return i.id===el.dataset.toggle; })[0];
    if(it){ it.archived = !it.archived; var d=dayOf(view); if(it.archived && d.pickId===it.id) d.pickId=null; }
    push(); refresh(); return;
  }
  if(el.dataset.walk){
    var wit = state.items.filter(function(i){ return i.id===el.dataset.walk; })[0];
    if(wit) wit.walk = WALK_ORDER[(WALK_ORDER.indexOf(wit.walk)+1) % WALK_ORDER.length];
    repick(); return;
  }
  if(el.dataset.long){
    state.settings.longFrom = el.dataset.long === "far" ? "far" : "10";
    repick(); return;
  }
  if(el.dataset.step){
    var p = el.dataset.step.split(":"), key=p[0], delta=+p[1];
    var LIM = { gapMeals:[0,6], maxPer:[1,9], windowMeals:[2,20], maxLongRun:[1,6] };
    var lim = LIM[key] || [0,9];
    state.settings[key] = Math.min(lim[1], Math.max(lim[0], state.settings[key]+delta));
    /* the cap is meaningless once the window is no wider than it */
    if(state.settings.windowMeals <= state.settings.maxPer)
      state.settings.windowMeals = Math.min(20, state.settings.maxPer + 1);
    repick(); return;
  }
  if(id==="dl" || id==="cp"){
    var json = JSON.stringify(state, null, 2);
    if(id==="cp"){ navigator.clipboard.writeText(json).then(function(){ toast("Copied"); },
      function(){ toast("Could not copy"); }); return; }
    var fname = "lunch-call-" + today() + ".json";
    if(window.claude && claude.use){
      claude.use("downloads").then(function(dl){
        if(!dl) return fileSave(json, fname);
        dl.save({ filename:fname, data:json })
          .then(function(){ toast("Saved"); }, function(){ toast("Download declined"); });
      }, function(){ fileSave(json, fname); });
    } else fileSave(json, fname);
    return;
  }
});
document.addEventListener("click", function(e){ if(e.target.id==="scrim") closeSheet(); });
document.addEventListener("keydown", function(e){
  if(e.key==="Escape" && openSheet) return closeSheet();
  if(openSheet || e.target.matches("input,textarea")) return;
  if(!$("#card")) return;
  if(e.key==="ArrowLeft"){ e.preventDefault(); reject(); }
  if(e.key==="ArrowRight"){ e.preventDefault(); accept(); }
});
document.addEventListener("keydown", function(e){
  if(e.key==="Enter" && e.target.id==="addName"){ e.preventDefault(); var b=$("#addGo"); if(b) b.click(); }
});

/* midnight / return-from-background rollover */
var seenDay = today();
setInterval(function(){
  var t = today();
  if(t!==seenDay){ seenDay=t; view=t; render(); }
}, 60000);
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState==="visible"){ var t=today(); if(t!==seenDay){ seenDay=t; view=t; render(); } }
});

/* ---------- boot: local first, upgrade to synced storage when it arrives ---------- */
var cached = readLocal();
if(cached) state = normalize(cached);
setSync(false);
render();

if(window.claude && typeof claude.use === "function"){
  claude.use("db").then(function(d){
    if(!d) return;
    db = d;
    return d.doc("lunch/state").get().then(function(snap){
      if(snap.exists){ state = normalize(snap.data()); writeLocal(); }
      else if(state.items.length){ push(); }
      setSync(true); render();
      d.doc("lunch/state").onSnapshot(function(s){
        if(!s.exists || s.metadata.hasPendingWrites) return;
        var incoming = JSON.stringify(s.data());
        if(incoming === lastPushed) return;
        state = normalize(s.data()); writeLocal(); refresh();
      }, function(){ /* listener died; local copy keeps working */ });
    });
  }).catch(function(){ /* stay on local storage */ });
}
})();
if("serviceWorker" in navigator) addEventListener("load", function(){
  navigator.serviceWorker.register("sw.js").catch(function(){});
});
</script>

</body>
